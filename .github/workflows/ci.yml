name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Byte-compile plugin sources
        run: python -m compileall -q src

      - name: Shell syntax check
        run: |
          for f in $(git ls-files 'tests/*.sh' 'src/init.d/*' 'control/postinst' 'control/prerm'); do
            echo "sh -n $f"
            sh -n "$f"
          done

      - name: Unit tests
        run: make test

      - name: Build IPK
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext fakeroot binutils
          make ipk
          ls -l build/*.ipk

      - name: Check VERSION suffix matches branch
        # A main -> develop back-merge legitimately carries the clean release
        # version, so it is exempt from the develop build-counter rule.
        if: github.head_ref != 'main'
        run: |
          RAW=$(tr -d '[:space:]' < VERSION)
          BASE_REF="${{ github.base_ref || github.ref_name }}"
          echo "VERSION=$RAW base=$BASE_REF"
          case "$BASE_REF" in
            develop)
              # develop always carries the rolling build counter
              case "$RAW" in
                *-build[0-9]*) : ;;
                *) echo "::error::VERSION '$RAW' on develop must look like X.Y.Z-buildN"; exit 1 ;;
              esac
              ;;
          esac
